services:
  # =======================================================
  # 1. CloudiQS Strands Risk Monitor Agent (AgentCore MicroVM)
  # =======================================================
  risk-monitor-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudiqs-risk-monitor-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - AGENT_VERSION=1.0.0
      - PORT=8080
      - AGENT_EXECUTION_MODE=auto
      - AWS_REGION=us-east-1
      - BEDROCK_MODEL_ID=anthropic.claude-3-5-sonnet-20241022-v2:0
      - DEFAULT_WEBHOOK_URL=http://mock-webhook-receiver:8081/webhook/risk-alerts
      - WEBHOOK_HMAC_SECRET=cloudiqs-shared-secret-key-32chars
    depends_on:
      - mock-webhook-receiver
    networks:
      - risk-network

  # =======================================================
  # 2. Mock Webhook Receiver (Simulating SIEM / Risk Ops)
  # =======================================================
  mock-webhook-receiver:
    build:
      context: .
      dockerfile: docker/mock_webhook.Dockerfile
    container_name: cloudiqs-mock-webhook-receiver
    restart: unless-stopped
    ports:
      - "8081:8081"
    networks:
      - risk-network

networks:
  risk-network:
    driver: bridge
